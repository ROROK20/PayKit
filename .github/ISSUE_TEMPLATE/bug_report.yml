name: Bug Report
description: Report a problem or unexpected behavior in PayKit
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the
        sections below so we can reproduce and fix the issue quickly.

        ⚠️ **Do not report security vulnerabilities here.** See
        [SECURITY.md](https://github.com/ROROK20/PayKit/blob/main/SECURITY.md)
        for private disclosure.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: When I call executor.execute() with the same key twice, ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet or steps that reproduce the behavior.
      placeholder: |
        1. Create an IdempotentPaymentExecutor with a MockProvider
        2. Call execute() with idempotencyKey "abc"
        3. ...
      render: typescript
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error messages or stack traces.
    validations:
      required: true

  - type: input
    id: paykit-version
    attributes:
      label: PayKit version
      description: Output of `npm ls paykit` or the version in your package.json.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v20.11.0
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Which provider were you using?
      options:
        - MockProvider
        - StripeProvider
        - Custom provider
        - Not provider-specific
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, screenshots, or logs about the problem.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md).
          required: true
